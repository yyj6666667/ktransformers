name: ktransformers-dsv4

services:
  server:
    image: ${IMAGE_REPOSITORY:-ktransformers}:${IMAGE_TAG:-dsv4-flash-cu128}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dsv4
      args:
        DSV4_BASE_IMAGE: ${DSV4_BASE_IMAGE:-docker.m.daocloud.io/nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        IMAGE_VERSION: ${IMAGE_VERSION:-dsv4-flash-cu128}
        VCS_REF: ${VCS_REF:-unknown}
        SGLANG_REF: ${SGLANG_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-https://github.com/yyj6666667/ktransformers}
        SGLANG_SOURCE: ${SGLANG_SOURCE:-https://github.com/yyj6666667/sglang}
    devices:
      - "nvidia.com/gpu=all"
    ipc: host
    cap_add:
      - SYS_NICE
    environment:
      MODEL_PATH: /model
      HOST: 0.0.0.0
      PORT: ${PORT:-30000}
      # GPU_DEVICE is retained for compatibility and now accepts a
      # comma-separated CUDA-visible device list, e.g. GPU_DEVICE=0,1.
      CUDA_VISIBLE_DEVICES: "${GPU_DEVICE:-0}"
      TP: "${TP:-1}"
      CONTEXT_LENGTH: ${CONTEXT_LENGTH:-16384}
      MEM_FRACTION: ${MEM_FRACTION:-0.90}
      KT_GPU_EXPERTS: ${KT_GPU_EXPERTS:-0}
      KT_GPU_PREFILL_TOKEN_THRESHOLD: ${KT_GPU_PREFILL_TOKEN_THRESHOLD:-2048}
      CHUNKED_PREFILL_SIZE: ${CHUNKED_PREFILL_SIZE:-4096}
      MAX_PREFILL_TOKENS: ${MAX_PREFILL_TOKENS:-4096}
      MAX_TOTAL_TOKENS: ${MAX_TOTAL_TOKENS:-}
      SWA_FULL_TOKENS_RATIO: ${SWA_FULL_TOKENS_RATIO:-0.4}
      KT_CPUINFER_THREADS: ${KT_CPUINFER_THREADS:-}
      KT_THREADPOOL_COUNT: ${KT_THREADPOOL_COUNT:-}
      ENABLE_MTP: ${ENABLE_MTP:-0}
      KT_KERNEL_CPU_VARIANT: "${KT_KERNEL_CPU_VARIANT:-}"
      KT_MXFP4_BACKEND: "${KT_MXFP4_BACKEND:-}"
      KT_KERNEL_DEBUG: "${KT_KERNEL_DEBUG:-0}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: ${MODEL_DIR:?Set MODEL_DIR to the downloaded DeepSeek-V4-Flash directory}
        target: /model
        read_only: true
      - dsv4-cache:/root/.cache
    ports:
      - "${PORT:-30000}:${PORT:-30000}"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error "http://127.0.0.1:$${PORT}/health_generate" >/dev/null
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m
    stop_grace_period: 2m

volumes:
  dsv4-cache:
